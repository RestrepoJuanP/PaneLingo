{% comment %}
Medidor de fuerza de contraseña.
El nivel nunca se comunica solo por color: la etiqueta de texto acompaña
siempre a la barra. Se rellena desde static/js/app.js.
{% endcomment %}
<div class="strength" data-strength-for="{{ input_id }}">
  <span class="strength__track" aria-hidden="true">
    <span class="strength__fill"></span>
  </span>
  <span class="strength__label" aria-live="polite"></span>
</div>
