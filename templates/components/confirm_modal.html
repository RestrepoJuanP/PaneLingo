{# Modal de confirmación.
   Accesible: role="dialog", aria-modal, título asociado por aria-labelledby.
   El foco queda atrapado dentro y se cierra con Escape; eso lo gestiona
   static/js/app.js. #}
<div
  class="modal"
  id="{{ modal_id }}"
  role="dialog"
  aria-modal="true"
  aria-labelledby="{{ modal_id }}-title"
  hidden
>
  <div class="modal__dialog modal__dialog--sm">
    <h2 class="modal__title" id="{{ modal_id }}-title">{{ title }}</h2>
    <p class="modal__body">{{ body }}</p>
    <div class="modal__foot">
      <button type="button" class="btn btn--secondary" data-modal-close>
        {{ cancel_label|default:"Cancelar" }}
      </button>
      {% if action_url %}
        <form method="post" action="{{ action_url }}">
          {% csrf_token %}
          <button type="submit" class="btn btn--danger-solid">
            {{ confirm_label|default:"Eliminar" }}
          </button>
        </form>
      {% else %}
        <button type="button" class="btn btn--danger-solid" disabled>
          {{ confirm_label|default:"Eliminar" }}
        </button>
      {% endif %}
    </div>
  </div>
</div>
