{% comment %}
Tarjeta de estadística. tone: ink (por defecto) | warning | brand, el color
del valor como en el mockup.
{% endcomment %}
<div class="stat-card">
  <div class="stat-card__label">{{ label }}</div>
  <div class="stat-card__value-row">
    <span class="stat-card__value stat-card__value--{{ tone|default:'ink' }}">{{ value }}</span>
    {% if hint %}<span class="stat-card__hint">{{ hint }}</span>{% endif %}
  </div>
</div>
