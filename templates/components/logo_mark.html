{% comment %}
Marca de PaneLingo: cuadrado con cruz interior, como en el mockup.
Decorativa: el nombre de la marca va siempre en texto al lado.
{% endcomment %}
<svg
  class="logo-mark"
  width="{{ size|default:24 }}"
  height="{{ size|default:24 }}"
  viewBox="0 0 24 24"
  fill="none"
  aria-hidden="true"
  focusable="false"
>
  <rect
    x="1.25" y="1.25" width="21.5" height="21.5" rx="6.5"
    stroke="{% if tone == 'light' %}#ffffff{% else %}var(--brand){% endif %}"
    stroke-width="1.5"
  />
  <path
    d="M12 1.5V22.5M1.5 12H22.5"
    stroke="{% if tone == 'light' %}#ffffff{% else %}var(--brand){% endif %}"
    stroke-width="1.5"
  />
</svg>
