{# Iconografía de la navegación. Decorativa: cada ítem lleva su texto. #}
<svg class="nav-item__icon" viewBox="0 0 17 17" fill="none" aria-hidden="true" focusable="false">
  {% if icon == "library" %}
    <rect x="1" y="1" width="15" height="15" rx="4" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8.5 1v15M1 8.5h15" stroke="currentColor" stroke-width="1.5"/>
  {% elif icon == "upload" %}
    <rect x="1" y="1" width="15" height="15" rx="4" stroke="currentColor" stroke-width="1.5"/>
    <path d="M1 8.5h15" stroke="currentColor" stroke-width="1.5"/>
  {% elif icon == "workspace" %}
    <rect x="1" y="1" width="15" height="15" rx="4" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8.5 1v15" stroke="currentColor" stroke-width="1.5"/>
  {% elif icon == "review" %}
    <rect x="1" y="1" width="15" height="15" rx="4" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="8.5" cy="8.5" r="2.5" fill="currentColor"/>
  {% elif icon == "signout" %}
    <path d="M6.5 1H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M11 5l3.5 3.5L11 12M14 8.5H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif icon == "terms" %}
    <rect x="1" y="1" width="15" height="15" rx="4" stroke="currentColor" stroke-width="1.5"/>
    <path d="M1 6h15M1 11h15" stroke="currentColor" stroke-width="1.5"/>
  {% else %}
    <rect x="1" y="1" width="15" height="15" rx="4" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="8.5" cy="8.5" r="3" stroke="currentColor" stroke-width="1.5"/>
  {% endif %}
</svg>
