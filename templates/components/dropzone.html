{# Zona de carga de archivos. Referencia: design/screenshots/upload-and-scan.png.
   Se usará en la HU-09 (cargar páginas). #}
<label class="dropzone" for="{{ input_id|default:'id_pages' }}">
  <span class="dropzone__mark" aria-hidden="true"></span>
  <span class="dropzone__title">{{ title|default:"Arrastra aquí las páginas completas" }}</span>
  <span class="dropzone__body">{{ body }}</span>
  <span class="dropzone__actions">
    <span class="btn btn--primary">Elegir archivos</span>
  </span>
</label>
