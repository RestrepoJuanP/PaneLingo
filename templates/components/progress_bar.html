{# Barra de progreso.
   Construida y documentada, pero NO usada en las pantallas del Sprint 1:
   una barra al 0% en cada álbum comunicaría un avance que no existe, porque
   la función de traducción llega en un sprint posterior. #}
<div class="progress{% if slim %} progress--slim{% endif %}">
  <div
    class="progress__track"
    role="progressbar"
    aria-valuenow="{{ percent|default:0 }}"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-label="{{ label|default:'Progreso' }}"
  >
    <div class="progress__fill" style="width: {{ percent|default:0 }}%"></div>
  </div>
  {% if show_value %}
    <span class="progress__value">{{ percent|default:0 }}%</span>
  {% endif %}
</div>
