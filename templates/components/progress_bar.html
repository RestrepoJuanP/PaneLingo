{% comment %}
Barra de progreso accesible. HU-25 la usa para el porcentaje de páginas
aprobadas; value_text comunica también la fracción que origina el porcentaje.
{% endcomment %}
<div class="progress{% if slim %} progress--slim{% endif %}">
  <div
    class="progress__track"
    role="progressbar"
    aria-valuenow="{{ percent|default:0 }}"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-label="{{ label|default:'Progreso' }}"
    {% if value_text %}aria-valuetext="{{ value_text }}"{% endif %}
  >
    <div class="progress__fill" style="width: {{ percent|default:0 }}%"></div>
  </div>
  {% if show_value %}
    <span class="progress__value">
      {% if value_text %}{{ value_text }}{% else %}{{ percent|default:0 }}%{% endif %}
    </span>
  {% endif %}
</div>
