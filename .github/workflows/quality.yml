name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Analisis estatico, pruebas y auditoria
    runs-on: ubuntu-latest

    env:
      # Valores de prueba: en CI no se toca ningun dato real y la base es una
      # SQLite efimera creada por el propio ejecutor. El secreto real vive en
      # las variables de entorno del despliegue, nunca en el repositorio.
      DJANGO_SECRET_KEY: clave-solo-para-integracion-continua-no-usar-en-produccion
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (analisis estatico)
        run: ruff check .

      - name: Black (verificacion de formato)
        run: black --check .

      - name: Django system checks
        run: python manage.py check

      - name: Pruebas automaticas
        run: python manage.py test

      # pip-audit es un paso obligatorio del Quality Gate y no debe eliminarse.
      # Si una dependencia reporta una vulnerabilidad sin version corregida,
      # se anade aqui --ignore-vuln <ID> con un comentario que justifique la
      # excepcion y enlace el aviso; nunca se suprime el paso completo.
      - name: Auditoria de dependencias
        run: pip-audit -r requirements.txt
